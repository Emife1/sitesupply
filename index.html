<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>SiteSupply</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root{--n:#0F1D3D;--o:#F45B1A;--e:#0D8C5E;--w:#FFF;--g5:#F8F9FB;--g1:#F0F2F5;--g2:#E2E5EA;--g4:#959DA8;--gm:#6B7480;--g6:#4A5159;--g7:#2D3339;--g8:#1A1E23;--g9:#0D1114;--a:#F59E0B;--r:10px;--rl:14px;--rp:9999px;--sh:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);--shl:0 12px 32px rgba(0,0,0,.08);--f:'Inter',-apple-system,sans-serif}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--f);background:var(--g5);color:var(--g7);line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased}
    .tn{background:rgba(255,255,255,.85);backdrop-filter:blur(16px);border-bottom:1px solid var(--g2);position:sticky;top:0;z-index:100;padding:0 1.5rem}
    .tni{max-width:1280px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:56px}
    .nl{display:flex;align-items:center;gap:.25rem}
    .nl a{padding:.4rem .75rem;border-radius:var(--r);font-size:.8125rem;font-weight:500;color:var(--gm);text-decoration:none;transition:all .15s;cursor:pointer}
    .nl a:hover{background:var(--g1);color:var(--g8)}.nl a.ac{background:var(--g1);color:var(--g9);font-weight:600}
    .btn{display:inline-flex;align-items:center;gap:.4rem;justify-content:center;padding:.5rem 1.125rem;border:none;border-radius:var(--r);font:600 .8125rem var(--f);cursor:pointer;transition:all .15s;text-decoration:none}
    .btn:hover{transform:hover{transform:translateY(-1px)}
    .bp{background:var(--n);color:var(--w)}.bp:hover{background:#1A3366;box-shadow:var(--shl)}
    .bo{background:var(--o);color:var(--w);border-radius:var(--rp);padding:.55rem 1.5rem}.bo:hover{background:#E0480F;box-shadow:var(--shl)}
    .be{background:var(--e);color:var(--w)}.bl{background:transparent;border:1.5px solid var(--g2);color:var(--g6)}.bl:hover{border-color:var(--g4);background:var(--g1)}
    .bs{padding:.3rem .75rem;font-size:.75rem}.bw{width:100%}
    .pc{max-width:1280px;margin:0 auto;padding:0 1.5rem}
    .cd{background:var(--w);border-radius:var(--rl);box-shadow:var(--sh);padding:1.5rem;margin-bottom:1rem;border:1px solid var(--g1);transition:all .2s}
    .cd:hover{box-shadow:var(--shl)}
    .fg{display:grid;grid-template-columns:1fr;gap:.75rem}
    @media(min-width:640px){.fg{grid-template-columns:1fr 1fr}.fg .fw{grid-column:1/-1}}
    label{display:block;font-size:.75rem;font-weight:600;color:var(--g6);margin-bottom:.2rem}
    input,select,textarea{weight:100%;padding:.5rem .625rem;border:1.5px solid var(--g2);border-radius:var(--r);font:400 .875rem var(--f);color:var(--g8);background:var(--g5);transition:all .15s}
    input:focus,select:focus,textarea:focus{outline:none;background:var(--w);border-color:var(--n);box-shadow:0 0 0 3px rgba(15,29,61,.08)}
    .sr{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin:1rem 0}
    @media(max-width:768px){.sr{grid-template-columns:repeat(2,1fr)}}
    .si{background:var(--w);border-radius:var(--rl);padding:1rem;text-align:center;box-shadow:var(--sh);border:1px solid var(--g1)}
    .sv{font-size:1.5rem;font-weight:800;color:var(--g9);letter-spacing:-0.03em}
    .sl{font-size:.625rem;color:var(--g4);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
    .bdg{display:inline-block;padding:.12rem .45rem;border-radius:var(--rp);font-size:.625rem;font-weight:600}
    .bb{background:transparent;border:1px solid var(--g2);color:var(--gm)}
    #map{height:400px;border-radius:var(--rl);margin:1rem 0;z-index:1}
    .em{text-align:center;padding:3rem 1rem;color:var(--g4);font-size:.8125rem}
    .mbn{display:none;position:fixed;bottom:0;left:0;right:0;z-index:99;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-top:1px solid var(--g2);padding:.2rem 0;justify-content:space-around}
    .mbn a{display:flex;flex-direction:column;align-items:center;gap:1px;padding:.25rem .4rem;color:var(--g4);text-decoration:none;font-size:.5rem;font-weight:500;min-width:52px}
    .mbn a.ac{color:var(--g9)}
    @media(max-width:768px){.nl{display:none}.mbn{display:flex}.pc{padding:0 .75rem}}
    .hd{padding:3rem 0 2rem;text-align:center;background:linear-gradient(180deg,var(--w),var(--g5))}
    .hd h1{font-size:clamp(1.75rem,5vw,2.75rem);font-weight:800;color:var(--g9);line-height:1.1;letter-spacing:-0.04em;margin-bottom:.75rem}
    .hd h1 span{color:var(--o)}.hd p{font-size:1rem;color:var(--gm);max-width:560px;margin:0 auto 1.5rem}
    .ph{padding:1.5rem 0 1rem;text-align:center;background:var(--w);border-bottom:1px solid var(--g1);margin-bottom:1.5rem}
    .ph h1{font-size:1.5rem;font-weight:700;color:var(--gm);font-size:.875rem}
    .cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.625rem;padding:2rem 0}
  </style>
</head>
<body>
</body>
</html>
