<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SiteSupply — Compare Construction Supply Quotes</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ═══ App Shell ═══ -->
<div id="app">

  <!-- Desktop Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="brand-dot"></span> SiteSupply
    </div>
    <nav class="sidebar-nav">
      <a href="#/" class="nav-link" data-route="/">Home</a>
      <a href="#/search" class="nav-link" data-route="/search">Search Quotes</a>
      <a href="#/quotes" class="nav-link" data-route="/quotes">My Quotes</a>
      <a href="#/dashboard" class="nav-link" data-route="/dashboard">Dashboard</a>
      <a href="#/suppliers" class="nav-link" data-route="/suppliers">Suppliers</a>
      <a href="#/about" class="nav-link" data-route="/about">About</a>
    </nav>
    <div class="sidebar-footer">
      <button class="btn-outline" onclick="location.hash='#/login'">Sign In</button>
    </div>
  </aside>

  <!-- Mobile Top Bar -->
  <header class="mobile-topbar">
    <a href="#/" class="mobile-brand"><span class="brand-dot"></span> SiteSupply</a>
    <button class="mobile-menu-btn" onclick="toggleMobileNav()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
  </header>

  <!-- Mobile Slide-Down Nav -->
  <div id="mobileNav" class="mobile-nav">
    <a href="#/" class="nav-link" data-route="/">Home</a>
    <a href="#/search" class="nav-link" data-route="/search">Search Quotes</a>
    <a href="#/quotes" class="nav-link" data-route="/quotes">My Quotes</a>
    <a href="#/dashboard" class="nav-link" data-route="/dashboard">Dashboard</a>
    <a href="#/suppliers" class="nav-link" data-route="/suppliers">Suppliers</a>
    <a href="#/about" class="nav-link" data-route="/about">About</a>
  </div>

  <!-- Main Content -->
  <main class="content" id="content">
    <!-- Router injects pages here -->
  </main>

  <!-- Mobile Bottom Nav -->
  <nav class="mobile-bottomnav">
    <a href="#/" class="bn-link" data-route="/"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Home</span></a>
    <a href="#/search" class="bn-link" data-route="/search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><span>Search</span></a>
    <a href="#/quotes" class="bn-link" data-route="/quotes"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><span>Quotes</span></a>
    <a href="#/dashboard" class="bn-link" data-route="/dashboard"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg><span>Dashboard</span></a>
  </nav>
</div>

<script src="app.js"></script>

</html>
