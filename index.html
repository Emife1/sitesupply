<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SiteSupply â€” Construction Supply Marketplace</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{--navy:#0F1D3D;--orange:#F45B1A;--emerald:#0D8C5E;--white:#FFF;--gray-50:#F8F9FB;--gray-100:#F0F2F5;--gray-200:#E2E5EA;--gray-400:#959DA8;--gray-500:#6B7480;--gray-600:#4A5159;--gray-700:#2D3339;--gray-800:#1A1E23;--gray-900:#0D1114;--amber:#F59E0B;--radius:10px;--radius-lg:14px;--radius-pill:9999px;--shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);--shadow-lg:0 12px 32px rgba(0,0,0,.08);--font:'Inter',-apple-system,sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;scroll-behavior:smooth}
body{font-family:var(--font);background:var(--gray-50);color:var(--gray-700);line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased}
.topnav{background:rgba(255,255,255,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--gray-200);position:sticky;top:0;z-index:100;padding:0 1.5rem}
.topnav-inner{max-width:1280px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:56px}
.nav-links{display:flex;align-items:center;gap:.25rem}
.nav-links a{padding:.4rem .75rem;border-radius:var(--radius);font-size:.8125rem;font-weight:500;color:var(--gray-500);text-decoration:none;transition:all .15s}
.nav-links a:hover{background:var(--gray-100);color:var(--gray-800)}
.btn{display:inline-flex;align-items:center;gap:.4rem;justify-content:center;padding:.5rem 1.125rem;border:none;border-radius:var(--radius);font:600 .8125rem var(--font);cursor:pointer;transition:all .15s;text-decoration:none}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--navy);color:var(--white)}.btn-primary:hover{background:#1A3366;box-shadow:var(--shadow-lg)}
.btn-orange{background:var(--orange);color:var(--white);border-radius:var(--radius-pill);padding:.55rem 1.5rem}.btn-orange:hover{background:#E0480F;box-shadow:var(--shadow-lg)}
.btn-emerald{background:var(--emerald);color:var(--white)}
.btn-outline{background:transparent;border:1.5px solid var(--gray-200);color:var(--gray-600)}.btn-outline:hover{border-color:var(--gray-400);background:var(--gray-50)}
.btn-sm{padding:.3rem .75rem;font-size:.75rem}
.btn-block{width:100%}
.page-container{max-width:1280px;margin:0 auto;padding:0 1.5rem}
.card{background:var(--white);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:1.5rem;margin-bottom:1rem;border:1px solid var(--gray-100)}
.card:hover{box-shadow:var(--shadow-lg)}
.form-grid{display:grid;grid-template-columns:1fr;gap:.75rem}
@media(min-width:640px){.form-grid{grid-template-columns:1fr 1fr}.form-grid .full{grid-column:1/-1}}
label{display:block;font-size:.75rem;font-weight:600;color:var(--gray-600);margin-bottom:.2rem}
input,select,textarea{width:100%;padding:.5rem .625rem;border:1.5px solid var(--gray-200);border-radius:var(--radius);font:400 .875rem var(--font);color:var(--gray-800);background:var(--gray-50);transition:all .15s}
input:focus,select:focus,textarea:focus{outline:none;background:var(--white);border-color:var(--navy);box-shadow:0 0 0 3px rgba(15,29,61,.08)}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin:1rem 0}
@media(max-width:768px){.stats-row{grid-template-columns:repeat(2,1fr)}}
.stat-item{background:var(--white);border-radius:var(--radius-lg);padding:1rem;text-align:center;box-shadow:var(--shadow);border:1px solid var(--gray-100)}
.stat-value{font-size:1.5rem;font-weight:800;color:var(--gray-900);letter-spacing:-0.03em}
.stat-label{font-size:.625rem;color:var(--gray-400);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.badge{display:inline-block;padding:.12rem .45rem;border-radius:var(--radius-pill);font-size:.625rem;font-weight:600}
.badge-outline{background:transparent;border:1px solid var(--gray-200);color:var(--gray-500)}
.data-table{width:100%;border-collapse:collapse;font-size:.75rem}
.data-table th{text-align:left;padding:.5rem .625rem;background:var(--gray-50);color:var(--gray-400);font-weight:600;font-size:.625rem;text-transform:uppercase;letter-spacing:.05em;border-bottom:2px solid var(--gray-100)}
.data-table td{padding:.5rem .625rem;border-bottom:1px solid var(--gray-50);color:var(--gray-600)}
.data-table tr:hover td{background:var(--gray-50)}
#map{height:400px;border-radius:var(--radius-lg);margin:1rem 0;z-index:1}
.empty{text-align:center;padding:3rem 1rem;color:var(--gray-400);font-size:.8125rem}
.fade{animation:fade .3s ease}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.mobile-bottomnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:99;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-top:1px solid var(--gray-200);padding:.2rem 0;justify-content:space-around}
.mobile-bottomnav a{display:flex;flex-direction:column;align-items:center;gap:1px;padding:.25rem .4rem;color:var(--gray-400);text-decoration:none;font-size:.5rem;font-weight:500;min-width:52px}
.mobile-bottomnav a.active{color:var(--gray-900)}
@media(max-width:768px){.nav-links{display:none}.mobile-bottomnav{display:flex}.page-container{padding:0 .75rem}}
</style>
</head>
